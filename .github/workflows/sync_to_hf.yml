name: Sync to Hugging Face hub
on:
  push:
    branches: [main]

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace 'username' and 'space-name' with your actual values!
          # For example: git push https://AnkitPandey:$HF_TOKEN@huggingface.co/spaces/AnkitPandey/readmission-predictor main --force
          git push https://Akpandey20:$HF_TOKEN@huggingface.co/spaces/Akpandey20/readmission-predictor main --force
